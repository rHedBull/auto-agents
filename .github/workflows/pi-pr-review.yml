name: PI PR Review (Reusable)

on:
  workflow_call:
    inputs:
      model:
        description: "Model to use (e.g. claude-sonnet-4-20250514, claude-opus-4-20250514)"
        type: string
        default: claude-sonnet-4-20250514
      thinking_level:
        description: "Thinking level: off, minimal, low, medium, high, xhigh"
        type: string
        default: medium
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_OAUTH:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Download skill
        env:
          WORKFLOW_REPO: rHedBull/auto-agents
        run: |
          mkdir -p .pi/skills/pr-review
          curl -sfL "https://raw.githubusercontent.com/${WORKFLOW_REPO}/main/skills/pr-review/SKILL.md" \
            -o .pi/skills/pr-review/SKILL.md

      - name: Setup auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_OAUTH: ${{ secrets.ANTHROPIC_OAUTH }}
        run: |
          mkdir -p ~/.pi/agent
          if [ -n "$ANTHROPIC_OAUTH" ]; then
            echo "{\"anthropic\":$ANTHROPIC_OAUTH}" > ~/.pi/agent/auth.json
            echo "🔑 Using OAuth credentials (Claude subscription)"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "{\"anthropic\":{\"type\":\"api_key\",\"key\":\"$ANTHROPIC_API_KEY\"}}" > ~/.pi/agent/auth.json
            echo "🔑 Using API key"
          else
            echo "❌ Either ANTHROPIC_API_KEY or ANTHROPIC_OAUTH secret must be set"
            exit 1
          fi

      - name: Run PR Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pi --model "${{ inputs.model }}" \
             --thinking "${{ inputs.thinking_level }}" \
             --no-session \
             -p "Review PR #${PR_NUMBER} using the pr-review skill. After the review, post it as a PR review comment using 'gh pr review' — do NOT ask for confirmation, just post it."
